name: Feature request
description: Propose a change to Tasker.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the task that Tasker does not support.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change. Keep the scope small.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [rolodex, transport keys, adapters, skills, packaging, documentation, other]
    validations:
      required: true
