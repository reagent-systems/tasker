name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-vite build

  package:
    name: package ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package without publication
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: tasker-${{ matrix.os }}
          path: release/**/*
          retention-days: 7
          if-no-files-found: warn
