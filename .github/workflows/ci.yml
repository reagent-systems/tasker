name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check the types
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec electron-vite build

      - name: Test the run path in Electron
        if: runner.os != 'Linux'
        run: pnpm run test:integration

      - name: Test the run path in Electron with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration

  package:
    name: package ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package without publication
        run: pnpm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: tasker-${{ matrix.os }}
          path: release/**/*
          retention-days: 7
          if-no-files-found: warn
