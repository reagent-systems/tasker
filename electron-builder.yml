appId: dev.tasker.widget
productName: Tasker
copyright: Copyright © 2026 Tasker contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
electronLanguages:
  - en-US

extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Tasker sends key events to the Claude desktop app.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: Tasker

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  icon: build/icons
  category: Utility
  desktop:
    entry:
      Name: Tasker
      Comment: Play and record Claude skills
      Categories: Utility;Development;

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  releaseType: release
